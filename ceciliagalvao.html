<style>

  :root{
    --bg: #070c17;
    --paper: #f3eee3;
    --muted: rgba(243,238,227,0.62);
    --champagne: #a9c6d8;
    --glass-fill: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    --glass-border: rgba(255,255,255,0.14);
    --glass-shadow: 0 14px 40px rgba(0,0,0,0.4);
  }

  *{ box-sizing: border-box; }

  html{ background: var(--bg); }

  body{
    margin: 0;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    min-height: 100vh;
  }

  .mesh{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .blob{ position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
  .blob.b1{ width: 340px; height: 340px; top: -80px; left: -60px;
    background: radial-gradient(circle, rgba(169,198,216,0.55), transparent 70%); }
  .blob.b2{ width: 380px; height: 380px; top: 260px; right: -120px;
    background: radial-gradient(circle, rgba(46,110,125,0.5), transparent 70%); }
  .blob.b3{ width: 320px; height: 320px; bottom: 220px; left: -100px;
    background: radial-gradient(circle, rgba(107,74,118,0.45), transparent 70%); }
  .blob.b4{ width: 300px; height: 300px; bottom: -140px; right: -60px;
    background: radial-gradient(circle, rgba(58,90,140,0.4), transparent 70%); }

  .page{
    position: relative;
    z-index: 1;
    max-width: 430px;
    margin: 0 auto;
    padding: 26px 20px 34px;
  }

  /* HERO */
  .hero-card{
    position: relative;
    margin: -26px -20px 0;
    border-radius: 0;
    overflow: hidden;
    background: var(--glass-fill);
  }

  .photo-area{
    position: relative;
    height: 62vh;
    min-height: 440px;
    max-height: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, rgba(169,198,216,0.10), rgba(46,110,125,0.10));
  }

  .photo-icon{ width: 72px; height: 72px; opacity: 0.26; }

  .hero-photo{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    display: block;
  }

  .photo-note{
    position: absolute;
    top: 16px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(243,238,227,0.32);
  }

  .hero-caption{
    padding: 24px 22px 26px;
    border-top: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(180deg, rgba(7,12,23,0.10), rgba(7,12,23,0.6));
    text-align: center;
  }

  .hero-tag{
    display: inline-flex;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid rgba(169,198,216,0.4);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--champagne);
    margin-bottom: 12px;
  }

  .hero-name{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 32px;
    color: var(--paper);
    line-height: 1.1;
  }

  /* BIO */
  .bio{
    padding: 24px 10px 4px;
    text-align: center;
  }

  .bio p{
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
  }

  .bio p.line-2{
    color: var(--paper);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    margin-top: 4px;
  }

  /* CHIPS DE ATUAÇÃO */
  .chips{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 18px 10px 0;
  }

  .chip{
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: rgba(243,238,227,0.72);
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.03);
  }

  .ornament{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 24px 0;
  }

  .ornament .line{ width: 28px; height: 1px; background: rgba(169,198,216,0.35); }
  .ornament .dot{ width: 4px; height: 4px; border-radius: 50%; background: var(--champagne); opacity: 0.7; }

  /* LINKS */
  .links{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 20px;
    text-decoration: none;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .link-card:hover{ border-color: rgba(169,198,216,0.5); transform: translateY(-1px); }

  .link-text{ display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }

  .link-eyebrow{
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--champagne);
  }

  .link-title{
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 17px;
    color: var(--paper);
  }

  .link-sub{
    font-size: 12px;
    color: var(--muted);
  }

  .link-thumb{
    width: 74px;
    height: 74px;
    border-radius: 14px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.16);
    background: linear-gradient(150deg, rgba(169,198,216,0.14), rgba(46,110,125,0.14));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .link-thumb svg{ width: 30px; height: 30px; opacity: 0.4; }

  .link-thumb-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* FOOTER */
  footer{ margin-top: 30px; text-align: center; }

  .signature{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    color: rgba(243,238,227,0.5);
    margin-bottom: 6px;
  }

  .copyright{
    font-size: 10px;
    letter-spacing: 0.05em;
    color: rgba(243,238,227,0.24);
  }

</style>

<!-- GA4: evento whatsapp_click.
     Esta landing page não carrega js/main.js (design próprio), por isso o
     listener vive aqui. Mesma regra: um listener delegado, um evento por
     clique, e nenhum dado pessoal enviado (o telefone é removido da URL). -->
<script>
(function () {
  if (window.__bglWaTracker) return;
  window.__bglWaTracker = true;
  var WA_HOST = /(^|\.)wa\.me$|(^|\.)whatsapp\.com$/i;
  var ultimo = { el: null, t: 0 };
  document.addEventListener("click", function (e) {
    var alvo = e.target;
    if (!alvo || typeof alvo.closest !== "function") return;
    var link = alvo.closest("a[href]");
    if (!link) return;
    var url;
    try { url = new URL(link.href, window.location.href); } catch (err) { return; }
    if (!WA_HOST.test(url.hostname)) return;
    var agora = Date.now();
    if (link === ultimo.el && agora - ultimo.t < 350) return;
    ultimo = { el: link, t: agora };
    if (typeof window.gtag !== "function") return;
    var t = (link.textContent || "").replace(/\s+/g, " ").trim();
    if ((t.match(/\d/g) || []).length >= 6) t = "";
    var params = {
      link_url: url.protocol + "//" + url.hostname + "/",
      link_domain: url.hostname,
      link_position: link.closest(".link-card") ? "link_bio" : "conteudo",
      page_location: window.location.href,
      page_title: document.title
    };
    if (t) params.link_text = t.slice(0, 100);
    window.gtag("event", "whatsapp_click", params);
  }, false);
})();
</script>
