<style>
/* =========================================================================
   01 · TOKENS - navy da identidade BGL + champagne
   ========================================================================= */
:root {
  --bg:            #0e1a2e;
  --bg-soft:       #16243d;
  --bg-soft-2:     #1b2c48;
  --line:          #2b3f5e;
  --line-strong:   #3d5477;

  --text:          #eef1f6;
  --text-soft:     #a8b4c6;
  --text-mute:     #7d8ba1;

  --accent:        #cf9e4d;
  --accent-soft:   #e0bd85;
  --accent-ink:    #10203a;

  --wa:            #1f8a5b;
  --wa-hover:      #1a744c;
  --erro:          #e0857d;
  --erro-bg:       rgba(224,133,125,.10);

  --raio: 8px;
  --alvo: 68px;
  --col: 27rem;
  --ease: cubic-bezier(.22,.61,.36,1);
  --fonte: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto,
           "Helvetica Neue", Arial, sans-serif;
}

/* =========================================================================
   02 · RESET E BASE
   ========================================================================= */
*,*::before,*::after { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
  margin: 0;
  font-family: var(--fonte);
  font-size: 1rem;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1,h2,h3 { margin: 0; font-weight: 600; line-height: 1.22; letter-spacing: -.015em }
p { margin: 0 }
button, input { font: inherit; color: inherit }
a { color: var(--accent) }
::selection { background: var(--accent); color: var(--accent-ink) }

/* =========================================================================
   03 · LAYOUT, CABECALHO E PROGRESSO
   ========================================================================= */
.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(900px 420px at 50% -12%, rgba(207,158,77,.10), transparent 68%),
    var(--bg);
}
.col { width: 100%; max-width: var(--col); margin: 0 auto; padding: 0 20px }

.head { padding: 26px 0 18px; text-align: center }
.head__logo { height: 46px; width: auto; margin: 0 auto; display: block }
.head__word {
  font-size: 1.05rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--text); font-weight: 500;
}
.head__word small {
  display: block; margin-top: 5px;
  font-size: .58rem; letter-spacing: .26em; color: var(--text-mute); font-weight: 400;
}

/* So a barra: o numero de etapas nao aparece, de proposito. */
.progress { padding-bottom: 22px }
.progress[hidden] { display: none }
.progress__track {
  height: 3px; border-radius: 3px; background: var(--line);
  position: relative; overflow: hidden;
}
.progress__bar {
  position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-soft), var(--accent));
  transition: width .45s var(--ease);
}

/* =========================================================================
   04 · TIPOGRAFIA
   ========================================================================= */
.stage { flex: 1 0 auto; padding-bottom: 6px }
.view { animation: entra .34s var(--ease) both }
.view.is-back { animation-name: entraVolta }
@keyframes entra      { from { opacity:0; transform: translateY(9px) }  to { opacity:1; transform:none } }
@keyframes entraVolta { from { opacity:0; transform: translateY(-7px) } to { opacity:1; transform:none } }
@media (prefers-reduced-motion: reduce) {
  .view, .view.is-back { animation: none }
  * { transition-duration: .01ms !important }
}

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px;
  font-size: .66rem; letter-spacing: .2em; text-transform: uppercase;
  color: var(--accent); font-weight: 500;
}
.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--accent) }

.title      { font-size: 1.42rem }
.title--big { font-size: clamp(1.6rem, 6.2vw, 2rem) }
.sub        { margin-top: 12px; color: var(--text-soft); font-size: .96rem }
.hint       { margin-top: 8px; color: var(--text-mute); font-size: .84rem }

/* =========================================================================
   05 · OPCOES E CAMPOS
   ========================================================================= */
.q { margin-top: 20px }
.opts { display: grid; gap: 8px }

.opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: var(--alvo); padding: 12px 16px; text-align: left;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--raio);
  cursor: pointer;
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.opt:hover { background: var(--bg-soft-2); border-color: var(--line-strong) }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.opt__mark {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); position: relative;
  transition: border-color .18s var(--ease);
}
.opt__mark::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink);
  transform: scale(0); transition: transform .2s var(--ease);
}
.opt__text { font-size: .97rem; line-height: 1.35 }
.opt.is-on {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 500;
}
.opt.is-on .opt__mark { border-color: var(--accent-ink) }
.opt.is-on .opt__mark::after { transform: scale(1) }

.campos { display: grid; gap: 10px }
.inp {
  width: 100%; min-height: var(--alvo); padding: 14px 16px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--raio);
  appearance: none; -webkit-appearance: none;
  transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
}
.inp::placeholder { color: var(--text-mute) }
.inp:hover { border-color: var(--line-strong) }
.inp:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(207,158,77,.16);
}
.inp.is-error { border-color: var(--erro); background: var(--erro-bg) }

.err { display: none; margin-top: 8px; font-size: .83rem; color: var(--erro) }
.err.is-on { display: block }

/* =========================================================================
   06 · BOTOES E NAVEGACAO
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--alvo); padding: 14px 24px;
  border: 1px solid transparent; border-radius: var(--raio);
  font-size: 1rem; font-weight: 600; letter-spacing: .01em;
  cursor: pointer; text-decoration: none;
  transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.btn--primary { background: var(--accent); color: var(--accent-ink) }
.btn--primary:hover { background: var(--accent-soft); transform: translateY(-1px) }
.btn--ghost {
  min-height: 44px; padding: 8px 12px; font-weight: 400; font-size: .92rem;
  background: none; color: var(--text-mute);
}
.btn--ghost:hover { color: var(--text) }
.btn--wa { background: var(--wa); color: #fff }
.btn--wa:hover { background: var(--wa-hover); transform: translateY(-1px) }
.btn--wa svg { width: 21px; height: 21px; flex: none }
.btn--block { width: 100% }

.nav {
  position: sticky; bottom: 0; z-index: 5;
  padding: 16px 0 max(18px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent 0%, var(--bg) 38%);
}
.nav__voltar { display: block; margin: 10px auto 0 }

/* =========================================================================
   07 · RESULTADO E RODAPE
   ========================================================================= */
.selo {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px;
  padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 100px;
  font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-soft);
}
.selo span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent) }

.painel {
  margin-top: 20px; padding: 18px 20px;
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--raio);
}
.painel__titulo {
  margin-bottom: 10px;
  font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-mute);
}
.painel ul { margin: 0; padding: 0; list-style: none }
.painel li {
  position: relative; padding-left: 18px; margin-bottom: 8px;
  font-size: .92rem; line-height: 1.5; color: var(--text-soft);
}
.painel li:last-child { margin-bottom: 0 }
.painel li::before {
  content: ""; position: absolute; left: 0; top: .62em;
  width: 7px; height: 1px; background: var(--accent);
}

.cta { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line) }
.cta__texto { margin-top: 10px; color: var(--text-soft); font-size: .95rem }
.cta__acoes { margin-top: 18px }
.cta__ref { margin-top: 12px; font-size: .74rem; color: var(--text-mute) }

.refazer {
  display: block; margin: 14px auto 0; padding: 6px;
  background: none; border: 0; cursor: pointer;
  font-size: .84rem; color: var(--text-mute);
  text-decoration: underline; text-underline-offset: 3px;
}
.refazer:hover { color: var(--text) }

.consent {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line);
  font-size: .78rem; line-height: 1.55; color: var(--text-mute);
}
.consent a { color: var(--text-soft); text-underline-offset: 3px }
.foot {
  flex: none; padding: 18px 0 26px; text-align: center;
  font-size: .72rem; line-height: 1.6; color: var(--text-mute);
}
.foot a { color: var(--text-mute) }
</style>

   ========================================================================= */
function byId(id) { return document.getElementById(id); }

function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}

function escapar(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function primeiroNome(nome) {
  return String(nome || '').trim().split(/\s+/)[0] || '';
}

function gerarRef() {
  return 'BGL-' + Date.now().toString(36).slice(-4).toUpperCase() +
         Math.floor(Math.random() * 36).toString(36).toUpperCase();
}

/* Mascara brasileira: (XX) XXXXX-XXXX */
function mascaraTelefone(v) {
  var d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length === 0) return '';
  if (d.length <= 2) return '(' + d;
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}

/* Valida DDD e quantidade de digitos. Celular com 11 digitos exige o 9. */
function telefoneValido(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.length !== 10 && d.length !== 11) return false;
  var ddd = parseInt(d.slice(0, 2), 10);
  var DDDS = [11,12,13,14,15,16,17,18,19,21,22,24,27,28,31,32,33,34,35,37,38,
              41,42,43,44,45,46,47,48,49,51,53,54,55,61,62,63,64,65,66,67,68,69,
              71,73,74,75,77,79,81,82,83,84,85,86,87,88,89,91,92,93,94,95,96,97,98,99];
  if (DDDS.indexOf(ddd) === -1) return false;
  if (d.length === 11 && d.charAt(2) !== '9') return false;
  if (/^(\d)\1+$/.test(d.slice(2))) return false;
  return true;
}

var ORIGEM_STORE = 'bgl_origem_divida';
var ORIGEM_VALIDADE_DIAS = 30;

function capturarOrigem() {
  var atual = {}, params, salvo = null, k;
  try { params = new URLSearchParams(window.location.search); } catch (e) { params = null; }
  if (params) {
    for (var i = 0; i < CHAVES_ORIGEM.length; i++) {
      var v = params.get(CHAVES_ORIGEM[i]);
      if (v) atual[CHAVES_ORIGEM[i]] = String(v).slice(0, 120);
    }
  }

  try {
    var raw = window.localStorage.getItem(ORIGEM_STORE);
    if (raw) {
      var obj = JSON.parse(raw);
      if ((Date.now() - (obj.ts || 0)) / 86400000 <= ORIGEM_VALIDADE_DIAS) salvo = obj.dados || null;
    }
  } catch (e) { /* sem localStorage: segue sem persistencia */ }

  var temAtual = false;
  for (k in atual) { if (atual.hasOwnProperty(k)) { temAtual = true; break; } }

  var origem = temAtual ? atual : (salvo || {});
  origem.referrer = origem.referrer || (document.referrer || '').slice(0, 160);
  origem.landing  = origem.landing  || (CONFIG.TOOL_URL || window.location.href).split('#')[0].slice(0, 200);

  if (temAtual) {
    try { window.localStorage.setItem(ORIGEM_STORE, JSON.stringify({ ts: Date.now(), dados: origem })); }
    catch (e) { /* ignora */ }
  }
  return origem;
}

function origemResumida() {
  var o = state.origem || {};
  var partes = [];
  if (o.utm_source)   partes.push(o.utm_source);
  if (o.utm_medium)   partes.push(o.utm_medium);
  if (o.utm_campaign) partes.push(o.utm_campaign);
  if (o.utm_content)  partes.push(o.utm_content);
  if (!partes.length && o.gclid)  partes.push('google-ads');
  if (!partes.length && o.fbclid) partes.push('meta-ads');
  return partes.join(' / ');
}

function carregarGtagSeNecessario() {
  if (!CONFIG.CARREGAR_TAGS_PROPRIAS) return;

  var id = CONFIG.GA4_MEASUREMENT_ID || CONFIG.GOOGLE_ADS_ID;
  if (!id) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  if (CONFIG.GA4_MEASUREMENT_ID) window.gtag('config', CONFIG.GA4_MEASUREMENT_ID);
  if (CONFIG.GOOGLE_ADS_ID) window.gtag('config', CONFIG.GOOGLE_ADS_ID);
}

function enviarEvento(nome, dados, eventoMetaPadrao) {
  dados = dados || {};
  dados.ferramenta = 'divida_empresarial';
  if (state.ref) dados.lead_ref = state.ref;

  if (typeof window.fbq === 'function') {
    try {
      if (eventoMetaPadrao) window.fbq('track', eventoMetaPadrao, dados);
      else window.fbq('trackCustom', nome, dados);
    } catch (e) { /* ignora */ }
  }

  if (window.dataLayer && typeof window.dataLayer.push === 'function' && window.google_tag_manager) {
    try {
      var payload = { event: nome };
      for (var k in dados) if (dados.hasOwnProperty(k)) payload[k] = dados[k];
      window.dataLayer.push(payload);
    } catch (e) { /* ignora */ }
  } else if (typeof window.gtag === 'function') {
    try { window.gtag('event', nome, dados); } catch (e) { /* ignora */ }
  }
}

/* =========================================================================
   06 · CAPTURA DO LEAD (planilha + e-mail)
   -------------------------------------------------------------------------
   O lead e enviado quando nome e WhatsApp passam na validacao, antes de o
   WhatsApp abrir. Se a rede falhar, fica em fila no navegador e e
   reenviado na troca de aba, ao fechar a pagina e na proxima visita. A
   chave "ref|evento" evita duplicata na planilha.

   Campos: seguem as colunas do script da planilha. A faixa da divida vai
   em "problema" (ex.: "Dívida empresarial — R$ 1 milhão a R$ 5 milhões"),
   que aparece no e-mail de aviso; o texto completo vai em "mensagem".
   ========================================================================= */
var FILA_STORE = 'bgl_fila_leads_divida';
var FILA_MAX_TENTATIVAS = 10;
var enviosFeitos = {};
var enviandoAgora = false;
var filaMemoria = null;

function filaLer() {
  try {
    var bruto = window.localStorage.getItem(FILA_STORE);
    if (bruto !== null) return JSON.parse(bruto);
  } catch (e) { /* armazenamento bloqueado: usa a memoria */ }
  return filaMemoria || [];
}

function filaEscrever(lista) {
  lista = lista.slice(-30);
  filaMemoria = lista;
  try { window.localStorage.setItem(FILA_STORE, JSON.stringify(lista)); }
  catch (e) { /* segue so em memoria */ }
}

function filaAdicionar(payload) {
  var lista = filaLer();
  lista.push({ id: payload.chave + '|' + Date.now(), tentativas: 0, payload: payload });
  filaEscrever(lista);
}

function filaRemover(id) {
  var restante = filaLer().filter(function (it) { return it.id !== id; });
  filaEscrever(restante);
  return restante;
}

function filaFalhou(id) {
  var restante = [];
  filaLer().forEach(function (it) {
    if (it.id === id) {
      it.tentativas = (it.tentativas || 0) + 1;
      if (it.tentativas >= FILA_MAX_TENTATIVAS) return;   /* desiste do item */
    }
    restante.push(it);
  });
  filaEscrever(restante);
  return restante;
}

function payloadLead(evento) {
  var a = state.answers;
  var o = state.origem || {};
  var digitos = String(a.whatsapp || '').replace(/\D/g, '');
  var faixa = faixaEscolhida();

  return {
    token: CONFIG.WEBHOOK_TOKEN || '',
    evento: evento,
    chave: state.ref + '|' + evento,
    ref: state.ref,
    data_iso: new Date().toISOString(),

    nome: String(a.nome || '').trim(),
    whatsapp: String(a.whatsapp || '').trim(),
    whatsapp_e164: digitos ? '55' + digitos : '',
    email: '',
    cidade: '',
    uf: '',

    problema: 'Dívida empresarial — ' + (faixa ? faixa.t : ''),
    valor_imovel: '',
    valor_divida: faixa ? faixa.t : '',
    classificacao: state.lead ? state.lead.classificacao : '',
    pontuacao: state.lead ? state.lead.pontuacao : 0,

    resumo: 'Dívida empresarial na faixa de ' + (faixa ? faixa.t : '') + '.',
    mensagem: montarMensagemWhatsApp(),

    origem: origemResumida(),
    utm_source: o.utm_source || '',
    utm_medium: o.utm_medium || '',
    utm_campaign: o.utm_campaign || '',
    utm_content: o.utm_content || '',
    utm_term: o.utm_term || '',
    gclid: o.gclid || '',
    fbclid: o.fbclid || '',
    referrer: o.referrer || '',

    ferramenta: 'divida_empresarial',
    pagina: CONFIG.TOOL_URL || window.location.href,
    duracao_seg: state.iniciadoEm ? Math.round((Date.now() - state.iniciadoEm) / 1000) : null,
    respostas: a
  };
}

/* Content-Type text/plain de proposito: evita o preflight OPTIONS, que o
   Apps Script nao responde. O corpo continua sendo JSON. */
function enviarItem(item, pronto) {
  var url = CONFIG.WEBHOOK_URL;
  var corpo = JSON.stringify(item.payload);
  if (!url) { pronto(false); return; }

  if (typeof window.fetch !== 'function') {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', url, true);
      x.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
      x.onload  = function () { pronto(x.status >= 200 && x.status < 400); };
      x.onerror = function () { pronto(false); };
      x.send(corpo);
    } catch (e) { pronto(false); }
    return;
  }

  var opcoes = {
    method: 'POST',
    keepalive: true,
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: corpo
  };

  try {
    window.fetch(url, opcoes).then(function (r) {
      pronto(!!r && (r.ok || r.type === 'opaque'));
    })['catch'](function () {
      /* CORS bloqueado: reenvia sem ler a resposta. A deduplicacao fica
         com o script da planilha. */
      try {
        opcoes.mode = 'no-cors';
        window.fetch(url, opcoes).then(function () { pronto(true); })['catch'](function () { pronto(false); });
      } catch (e2) { pronto(false); }
    });
  } catch (e) { pronto(false); }
}

function descarregarFila() {
  if (enviandoAgora || !CONFIG.WEBHOOK_URL) return;
  var lista = filaLer();
  if (!lista.length) return;

  enviandoAgora = true;
  var item = lista[0];
  enviarItem(item, function (ok) {
    enviandoAgora = false;
    var restante = ok ? filaRemover(item.id) : filaFalhou(item.id);
    if (!restante.length) return;
    if (ok) descarregarFila();
    else window.setTimeout(descarregarFila, 6000);
  });
}

/* Ultima tentativa quando a aba e fechada ou vai para segundo plano
   (acontece justamente quando o WhatsApp abre no celular). */
function descarregarComBeacon() {
  if (!CONFIG.WEBHOOK_URL || !navigator.sendBeacon) return;
  filaLer().forEach(function (it) {
    try {
      navigator.sendBeacon(CONFIG.WEBHOOK_URL,
        new Blob([JSON.stringify(it.payload)], { type: 'text/plain;charset=UTF-8' }));
    } catch (e) { /* ignora */ }
  });
}

function capturaAtiva() {
  return !!(CONFIG.WEBHOOK_URL && CONFIG.ENVIAR_LEAD_AUTOMATICO);
}

function enviarLead(evento) {
  if (!capturaAtiva()) return;
  var chave = state.ref + '|' + evento;
  if (enviosFeitos[chave]) return;
  enviosFeitos[chave] = true;
  filaAdicionar(payloadLead(evento));
  descarregarFila();
}

/* =========================================================================

   ========================================================================= */
function pintar(node) {
  stage.innerHTML = '';
  node.classList.add('view');
  if (state.voltando) node.classList.add('is-back');
  stage.appendChild(node);
  state.voltando = false;
}

function subir() {
  var y = stage.getBoundingClientRect().top + window.pageYOffset - 16;
  try { window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, Math.max(0, y)); }
}

/* So a barra, sem "etapa X de Y". */
function atualizarProgresso(etapa) {
  var box = byId('progress');
  if (!etapa) { box.hidden = true; return; }
  box.hidden = false;
  var pct = Math.round(etapa / 3 * 100);
  byId('progBar').style.width = pct + '%';
  byId('progTrack').setAttribute('aria-valuenow', String(pct));
}

function urlPrivacidade() {
  var u = CONFIG.PRIVACY_URL;
  if (!u || u.indexOf('INSERIR_URL') === 0) return CONFIG.SITE_URL;
  return u;
}

function mostrarErro(msg) {
  var e = byId('erro');
  if (e) { e.textContent = msg; e.classList.add('is-on'); }
}
function limparErro() {
  var e = byId('erro');
  if (e) { e.textContent = ''; e.classList.remove('is-on'); }
  var inputs = stage.querySelectorAll('.inp.is-error');
  for (var i = 0; i < inputs.length; i++) inputs[i].classList.remove('is-error');
}

      b.classList.add('is-on');
      b.setAttribute('aria-checked', 'true');

      : 'Ao enviar seus dados, você concorda que a BGL Advogados entre em contato para tratar da sua solicitação. ') +
    'Seus dados serão tratados de acordo com a legislação aplicável. ' +
    '<a href="' + urlPrivacidade() + '" target="_blank" rel="noopener">Política de Privacidade</a>.';
  q.appendChild(consent);
  tela.appendChild(q);

  var nav = el('div', 'nav');
  var paraWhats = CONFIG.ABRIR_WHATSAPP_AO_CONCLUIR;
  var enviar = el('button', 'btn btn--block ' + (paraWhats ? 'btn--wa' : 'btn--primary'),
    paraWhats ? 'Enviar pelo WhatsApp' : 'Enviar');
  enviar.type = 'button';
  enviar.id = 'btnNext';
  enviar.addEventListener('click', concluir);
  nav.appendChild(enviar);

  var voltar = el('button', 'btn btn--ghost nav__voltar', 'Voltar');
  voltar.type = 'button';
  voltar.addEventListener('click', function () {
    state.voltando = true;
    renderEtapa1();
    subir();
  });
  nav.appendChild(voltar);
  tela.appendChild(nav);

  pintar(tela);
}

/* Valida, registra o lead e leva ao WhatsApp. Roda dentro do clique (ou
   do Enter): fora dele o navegador bloquearia a nova aba. */
function concluir() {
  var a = state.answers;
  if (String(a.nome || '').trim().length < 2) {
    mostrarErro('Informe seu nome.');
    byId('f-nome').classList.add('is-error');
    return;
  }
  if (!telefoneValido(a.whatsapp)) {
    mostrarErro('Informe um número de WhatsApp válido, com DDD.');
    byId('f-whatsapp').classList.add('is-error');
    return;
  }

  var faixa = faixaEscolhida();
  state.lead = { classificacao: faixa.classe, pontuacao: faixa.pontos, faixa: faixa.t };
  trackLead();
  /* Captura: acontece aqui, e nao no WhatsApp. Quem preenche ja chega a
     planilha e ao e-mail, abrindo a conversa ou nao. */
  enviarLead('formulario_concluido');

  state.tela = 'resultado';
  var abriu = CONFIG.ABRIR_WHATSAPP_AO_CONCLUIR ? abrirWhatsApp() : false;
  renderResultado(abriu);
  subir();
}

/* --- Resultado (fica por tras do WhatsApp) -------------------------------
   abriu = o WhatsApp ja foi aberto automaticamente. */
function renderResultado(abriu) {
  atualizarProgresso(0);
  var nome = primeiroNome(state.answers.nome);
  var faixa = faixaEscolhida();

  var tela = el('div');
  tela.innerHTML =
    '<span class="selo"><span></span>Dívida empresarial</span>' +
    '<h2 class="title">' + (nome ? escapar(nome) + ', recebemos' : 'Recebemos') + ' suas informações.</h2>' +
    '<p class="sub">A equipe da BGL Advogados vai analisar a situação da sua empresa e orientar você sobre os próximos passos.</p>' +
    '<div class="painel">' +
      '<p class="painel__titulo">Você informou</p><ul>' +
      '<li>Dívida empresarial na faixa de ' + escapar(faixa ? faixa.t : '') + '.</li>' +
      '</ul></div>' +
    '<div class="cta">' +
      (abriu
        ? '<h3 class="title">O WhatsApp não abriu?</h3>' +
          '<p class="cta__texto">Toque no botão abaixo para enviar sua mensagem à equipe da BGL Advogados.</p>'
        : '<h3 class="title">Fale agora com a equipe da BGL</h3>' +
          '<p class="cta__texto">Envie sua mensagem pelo WhatsApp para agilizar o atendimento.</p>') +
      '<div class="cta__acoes">' +
        '<a class="btn btn--wa btn--block" id="btnWhats" href="#" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.95 1.16-.17.2-.35.22-.65.08-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2z"/></svg>' +
          'Falar com a BGL pelo WhatsApp</a>' +
        '<p class="cta__ref">Referência: ' + escapar(state.ref) + '</p>' +
        '<button class="refazer" type="button" id="btnRestart">Preencher novamente</button>' +
      '</div>' +
    '</div>' +
    '<p class="consent">' +
      (capturaAtiva()
        ? 'Suas informações foram registradas e a equipe da BGL Advogados poderá entrar em contato para tratar da sua solicitação. '
        : 'Ao enviar, você concorda que a BGL Advogados entre em contato para tratar da sua solicitação. ') +
      '<a href="' + urlPrivacidade() + '" target="_blank" rel="noopener">Política de Privacidade</a>.</p>';

  pintar(tela);

  var botao = byId('btnWhats');
  botao.href = linkWhatsApp();
  if (CONFIG.WHATSAPP_NOVA_ABA) botao.target = '_blank';
  botao.addEventListener('click', registrarCliqueWhatsApp);

  byId('btnRestart').addEventListener('click', function () {
    state.answers = {};
    state.lead = null;
    state.ref = gerarRef();
    state.iniciadoEm = 0;
    metaLeadDisparado = false;
    whatsappRegistrado = false;
    inicioRegistrado = false;
    renderEtapa1();
    subir();
  });
}

/* =========================================================================
   08 · WHATSAPP
   ========================================================================= */
function montarMensagemWhatsApp() {
  var a = state.answers;
  var faixa = faixaEscolhida();
  var linhas = [];

  linhas.push('Olá, equipe BGL. Preenchi o formulário de dívida empresarial pelo site e gostaria de uma análise.');
  linhas.push('');
  linhas.push('Nome: ' + String(a.nome || '').trim());
  linhas.push('Valor aproximado da dívida: ' + (faixa ? faixa.t : ''));
  linhas.push('');
  linhas.push('Gostaria de saber como a BGL pode ajudar a minha empresa.');

  var rodape = 'Ref.: ' + state.ref;
  var origem = origemResumida();
  if (origem) rodape += ' · Origem: ' + origem;
  linhas.push('');
  linhas.push(rodape);

  return linhas.join('\n');
}

function linkWhatsApp() {
  var numero = String(CONFIG.WHATSAPP_NUMBER || '').replace(/\D/g, '');
  var texto = encodeURIComponent(montarMensagemWhatsApp());
  return 'https://wa.me/' + numero + '?text=' + texto;
}

/* Conversao do WhatsApp registrada uma vez por lead: a abertura
   automatica e o botao da tela de resultado nao contam duas vezes. */
var whatsappRegistrado = false;

function registrarCliqueWhatsApp() {
  if (whatsappRegistrado) return;
  whatsappRegistrado = true;
  trackWhatsAppClick();
  /* Segundo registro na planilha: separa quem seguiu para o WhatsApp de
     quem parou na tela de resultado. */
  enviarLead('whatsapp_clique');
}

/* Devolve false quando o navegador bloqueia a nova aba - nesse caso a
   tela de resultado mostra o botao. */
function abrirWhatsApp() {
  var link = linkWhatsApp();

  if (!CONFIG.WHATSAPP_NOVA_ABA) {
    registrarCliqueWhatsApp();
    window.location.href = link;
    return true;
  }

  var janela = null;
  try { janela = window.open(link, '_blank'); } catch (e) { /* bloqueado */ }
  if (!janela) return false;
  try { janela.opener = null; } catch (e) { /* ignora */ }
  registrarCliqueWhatsApp();
  return true;
}

/* =========================================================================
   09 · INICIALIZACAO
   ========================================================================= */
function init() {
  /* Marca: a imagem so substitui o lettering se realmente carregar. */
  if (CONFIG.LOGO_URL) {
    var logo = byId('brandLogo');
    logo.onload = function () {
      logo.hidden = false;
      byId('brandWord').style.display = 'none';
    };
    logo.onerror = function () { logo.removeAttribute('src'); };
    logo.src = CONFIG.LOGO_URL;
  }

  byId('footPrivacy').href = urlPrivacidade();

  state.origem = capturarOrigem();
  state.ref = gerarRef();

  carregarGtagSeNecessario();

  /* Leads que ficaram na fila em visitas anteriores saem agora. */
  descarregarFila();
  window.addEventListener('pagehide', descarregarComBeacon);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') descarregarComBeacon();
    else descarregarFila();
  });

  renderEtapa1();

  /* Depuracao no console: BGL_DIVIDA.estado() */
  window.BGL_DIVIDA = {
    estado: function () { return { respostas: state.answers, origem: state.origem, lead: state.lead, ref: state.ref }; },
    config: CONFIG,
    mensagem: montarMensagemWhatsApp,
    fila: filaLer
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
